name: ZapLiga CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zapliga-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validar projeto
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test -- --runInBand

      - name: Testes frontend
        run: npm run test:web

      - name: Validar proteção operacional de áudio
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml config --quiet
          sh -n infra/waxum/entrypoint-guard.sh
          sh -n infra/waxum/healthcheck.sh
          # The Waxum service must run our locally built image (it carries the
          # multi-relay audio fix; see docs/postmortem-audio-unidirecional.md).
          # A compose that points back at the stock fdciabdul/waxum image would
          # reintroduce one-way audio on the next deploy, so refuse it here.
          grep -Eq '^\s+image:\s+zapliga-waxum:' docker-compose.yml \
            || { echo 'docker-compose.yml: o servico waxum precisa usar a imagem local zapliga-waxum:<tag> (ver infra/waxum/README.md)' >&2; exit 1; }
          test -s infra/waxum/patches/whatsapp-rust-zapliga.patch \
            || { echo 'infra/waxum/patches/whatsapp-rust-zapliga.patch ausente: o patch do Waxum precisa estar versionado' >&2; exit 1; }

      - name: Build
        run: npm run build

  e2e:
    name: Jornadas E2E no stack completo
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências e Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Subir stack com Waxum determinístico
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build postgres redis nats waxum api-a web
      - name: Aguardar API e interface
        run: |
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/health >/dev/null && curl -fsS http://127.0.0.1:5173/login >/dev/null && exit 0
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --tail=150
          exit 1
      - name: Criar admin de smoke e verificar isolamento
        env:
          DATABASE_URL: postgres://zapcall:zapcall@127.0.0.1:5432/zapcall
          SMOKE_API_URL: http://127.0.0.1:3000
          SMOKE_ADMIN_EMAIL: admin@zapliga.local
          SMOKE_ADMIN_PASSWORD: ZapCall-Smoke-2026!
          STRIPE_WEBHOOK_SECRET: whsec_local_e2e
          BILLING_ENFORCEMENT_MODE: enforce
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml exec -T api-a node apps/api/dist/scripts/bootstrap-admin.js
          npm run verify:multitenant
      - name: Executar 12 jornadas obrigatórias
        env:
          E2E_API_URL: http://127.0.0.1:3000
          E2E_WEB_URL: http://127.0.0.1:5173
        run: npm run test:e2e
      - name: Coletar logs em falha
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --tail=200
      - name: Encerrar stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

  deploy:
    name: Deploy produção
    needs: [validate, e2e]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Baixar código para deploy
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verificar host SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -H -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Atualizar servidor e recriar stack
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_LIVEMODE: ${{ secrets.STRIPE_LIVEMODE }}
          STRIPE_PORTAL_CONFIGURATION_ID: ${{ secrets.STRIPE_PORTAL_CONFIGURATION_ID }}
          BILLING_ENFORCEMENT_MODE: ${{ secrets.BILLING_ENFORCEMENT_MODE }}
        run: |
          set -euo pipefail
          deploy_key="$RUNNER_TEMP/zapliga-deploy-key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$deploy_key"
          chmod 600 "$deploy_key"

          tar --exclude=.git --exclude=.env -czf - . | ssh -i "$deploy_key" -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /opt/zapliga && tar -xzf - -C /opt/zapliga'

          ssh -i "$deploy_key" -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "GITHUB_SHA='$GITHUB_SHA' STRIPE_SECRET_KEY='$STRIPE_SECRET_KEY' STRIPE_WEBHOOK_SECRET='$STRIPE_WEBHOOK_SECRET' STRIPE_LIVEMODE='$STRIPE_LIVEMODE' STRIPE_PORTAL_CONFIGURATION_ID='$STRIPE_PORTAL_CONFIGURATION_ID' BILLING_ENFORCEMENT_MODE='$BILLING_ENFORCEMENT_MODE' bash -se" <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR=/opt/zapliga

          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker não está instalado no servidor" >&2
            exit 1
          fi

          cd "$APP_DIR"
           if [ ! -f .env ]; then
             echo "Crie /opt/zapliga/.env antes do primeiro deploy" >&2
             exit 1
           fi

           # The encrypted production environment secrets are synchronized into
           # the host-managed .env without ever printing their values. Existing
           # host values remain untouched when a secret is not configured yet.
           upsert_env_value() {
             local key="$1" value="$2" tmp
             [ -n "$value" ] || return 0
             tmp="$(mktemp)"
             awk -v key="$key" -v value="$value" '
               BEGIN { prefix = key "="; found = 0 }
               index($0, prefix) == 1 { print prefix value; found = 1; next }
               { print }
               END { if (!found) print prefix value }
             ' .env > "$tmp"
             chmod --reference=.env "$tmp" 2>/dev/null || chmod 600 "$tmp"
             mv "$tmp" .env
           }
           upsert_env_value STRIPE_SECRET_KEY "${STRIPE_SECRET_KEY:-}"
           upsert_env_value STRIPE_WEBHOOK_SECRET "${STRIPE_WEBHOOK_SECRET:-}"
           upsert_env_value STRIPE_LIVEMODE "${STRIPE_LIVEMODE:-}"
           upsert_env_value STRIPE_PORTAL_CONFIGURATION_ID "${STRIPE_PORTAL_CONFIGURATION_ID:-}"
           upsert_env_value BILLING_ENFORCEMENT_MODE "${BILLING_ENFORCEMENT_MODE:-}"

           # Billing is fail-closed in production. Validate the presence and
          # mode of its runtime configuration before touching infrastructure or
          # building images, while never printing secret values to the log.
          env_value() { grep -m1 "^$1=" .env 2>/dev/null | cut -d= -f2- || true; }
          stripe_secret_key="$(env_value STRIPE_SECRET_KEY)"
          stripe_webhook_secret="$(env_value STRIPE_WEBHOOK_SECRET)"
          stripe_livemode="$(env_value STRIPE_LIVEMODE)"
          stripe_portal_configuration="$(env_value STRIPE_PORTAL_CONFIGURATION_ID)"
          billing_enforcement="$(env_value BILLING_ENFORCEMENT_MODE)"
          if [ -z "$stripe_secret_key" ] || [ -z "$stripe_webhook_secret" ] || [ -z "$stripe_portal_configuration" ]; then
            echo "Billing Stripe incompleto no .env: STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET e STRIPE_PORTAL_CONFIGURATION_ID são obrigatórios" >&2
            exit 1
          fi
          if [ "$stripe_livemode" != "true" ]; then
            echo "STRIPE_LIVEMODE precisa ser true no deploy de produção" >&2
            exit 1
          fi
          case "$stripe_secret_key" in
            sk_live_*|rk_live_*) ;;
            *) echo "A chave Stripe de produção não é uma chave Live" >&2; exit 1 ;;
          esac
          case "$billing_enforcement" in
            ""|enforce|shadow) ;;
            *) echo "BILLING_ENFORCEMENT_MODE inválido (use enforce ou shadow)" >&2; exit 1 ;;
          esac

          COMPOSE=(docker compose -f docker-compose.yml)
          # The Waxum image is pinned in docker-compose.yml itself (a locally
          # built zapliga-waxum:<tag> that must already exist on the host --
          # see docs/deploy-runbook.md, "Imagem do Waxum"). There is
          # deliberately no host-side override file any more: the one that
          # used to live here (waxum-encfix.override.yml) silently reverted a
          # validated fix on 2026-09-04 by pinning an older image over the
          # committed one. If a host still carries that file, refuse to deploy
          # rather than let two sources of truth disagree.
          if [ -f waxum-encfix.override.yml ]; then
            echo "waxum-encfix.override.yml encontrado em $APP_DIR: remova-o; a imagem do Waxum e definida em docker-compose.yml" >&2
            exit 1
          fi

          "${COMPOSE[@]}" up -d postgres postgres-backup redis nats waxum

          # HTTP alone is insufficient: Waxum previously reported /livez while
          # its NATS integration was permanently disabled. The guarded
          # healthcheck only becomes healthy after NATS lists the Rust client.
          WAXUM_CONTAINER=$("${COMPOSE[@]}" ps -q waxum)
          for attempt in $(seq 1 60); do
            waxum_health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$WAXUM_CONTAINER" 2>/dev/null || true)
            if [ "$waxum_health" = healthy ]; then
              echo "Waxum saudável e conectado ao NATS"
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Waxum não confirmou conexão com NATS; deploy bloqueado" >&2
              "${COMPOSE[@]}" logs --tail=120 nats waxum >&2 || true
              exit 1
            fi
            sleep 2
          done

          # These references are explicit in docker-compose.yml. Keeping the
          # names deterministic prevents `docker compose config --images`
          # from returning every service image as one invalid tag.
          IMAGE_API_A=zapliga-api-a:latest
          IMAGE_API_B=zapliga-api-b:latest
          SHA_TAG="${GITHUB_SHA:0:12}"

          # Snapshot whatever is currently live as the rollback target BEFORE
          # building — the build below overwrites each image's :latest tag,
          # so the previous version would otherwise be gone with no way back.
          for img in "$IMAGE_API_A" "$IMAGE_API_B"; do
            docker image inspect "$img" >/dev/null 2>&1 && docker tag "$img" "${img%:*}:rollback" || true
          done

          "${COMPOSE[@]}" build api-a api-b web

          # Apply the database schema and register the versioned Stripe
          # Products/Prices before either API replica receives traffic. The
          # command is idempotent and reuses lookup keys, so every deploy keeps
          # the local catalog convergent with the configured Live account.
          # Close stdin explicitly: this script itself is fed to the remote
          # bash through stdin, and `docker compose run` otherwise can consume
          # the remaining commands instead of returning control to bash.
          "${COMPOSE[@]}" run -T --rm --no-deps api-a node apps/api/dist/scripts/migrate.js </dev/null
          "${COMPOSE[@]}" run -T --rm --no-deps api-a node apps/api/dist/scripts/sync-stripe-catalog.js </dev/null

          "${COMPOSE[@]}" stop api >/dev/null 2>&1 || true
          "${COMPOSE[@]}" rm -sf api >/dev/null 2>&1 || true

          # Roll api-a and api-b out one at a time instead of together. The
          # nginx upstream (infra/nginx/api.zapliga.com.conf) already routes
          # around whichever instance is down (ip_hash + max_fails), so a bad
          # image degrades capacity for a few seconds instead of taking the
          # whole API down — and if api-a's healthcheck fails, api-b never
          # receives the bad image at all.
          deploy_instance() {
            local service="$1" port="$2" image="$3"
            echo "Subindo $service ($image)..."
            "${COMPOSE[@]}" up -d --no-deps "$service"
            local attempt
            for attempt in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${port}/health" >/dev/null; then
                echo "$service saudável"
                docker tag "$image" "${image%:*}:$SHA_TAG"
                return 0
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "$service não ficou saudável a tempo" >&2
                "${COMPOSE[@]}" logs --tail=80 "$service" >&2 || true
                if docker image inspect "${image%:*}:rollback" >/dev/null 2>&1; then
                  echo "Revertendo $service para a imagem anterior" >&2
                  docker tag "${image%:*}:rollback" "$image"
                  "${COMPOSE[@]}" up -d --no-deps --no-build "$service"
                else
                  echo "Nenhuma imagem anterior disponível para reverter $service (primeiro deploy?)" >&2
                fi
                return 1
              fi
              sleep 2
            done
          }
          deploy_instance api-a 3000 "$IMAGE_API_A"
          deploy_instance api-b 3001 "$IMAGE_API_B"

          # The web image is content-addressed by Vite asset hashes, but the
          # Compose service itself has no config change when only frontend
          # source changes. Force the container replacement so the host cannot
          # keep serving the previous static bundle after a successful build.
          "${COMPOSE[@]}" up -d --force-recreate --remove-orphans web

          # Do not report a successful deploy while the local web endpoint is
          # still serving a bundle that predates the billing route. Resolve the
          # current hashed entrypoint from index.html and inspect that exact
          # asset without printing its contents.
          WEB_BASE="http://127.0.0.1:${WEB_HOST_PORT:-5173}"
          web_index=""
          for attempt in $(seq 1 30); do
            if web_index="$(curl -fsS "$WEB_BASE/app/" 2>/dev/null)"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Frontend não respondeu na porta ${WEB_HOST_PORT:-5173}" >&2
              exit 1
            fi
            sleep 2
          done
          web_asset="$(printf '%s' "$web_index" | sed -n 's/.*src="\(\/app\/assets\/index-[^"]*\.js\)".*/\1/p')"
          if [ -z "$web_asset" ] || ! curl -fsS "$WEB_BASE$web_asset" | grep -q '/app/cobranca'; then
            echo "Frontend publicado sem a rota /app/cobranca" >&2
            exit 1
          fi

          # Keep the rollback tag plus the last 5 SHA tags per API image so the
          # host doesn't accumulate every build indefinitely.
          for img in "$IMAGE_API_A" "$IMAGE_API_B"; do
            repo="${img%:*}"
            docker images --format '{{.CreatedAt}}\t{{.Repository}}:{{.Tag}}' "$repo" \
              | grep -vE ':(rollback|latest)$' | sort -r | tail -n +6 | cut -f2 \
              | xargs -r docker rmi >/dev/null 2>&1 || true
          done

          NGINX_CONF=/etc/icontainer/apps/nginx/nginx/conf/conf.d/api.zapliga.com.conf
          NGINX_CONTAINER=$(docker ps --format '{{.Names}}' | awk '/^ic-nginx-/{print; exit}')
          if [ -z "$NGINX_CONTAINER" ]; then
            echo "Container Nginx do ICP não encontrado" >&2
            exit 1
          fi
          cp "$NGINX_CONF" "${NGINX_CONF}.before-api-ha.$(date +%Y%m%d%H%M%S)"
          install -m 644 "$APP_DIR/infra/nginx/api.zapliga.com.conf" "$NGINX_CONF"
          if ! docker exec "$NGINX_CONTAINER" nginx -t; then
            latest_backup=$(ls -1t "${NGINX_CONF}.before-api-ha."* | head -1)
            cp "$latest_backup" "$NGINX_CONF"
            exit 1
          fi
          docker exec "$NGINX_CONTAINER" nginx -s reload

          "${COMPOSE[@]}" ps
          REMOTE
