name: Carregar imagem do Waxum

# The Waxum image is built off the VPS (infra/waxum/build.sh), uploaded as the
# asset of a release named after its tag, and this run loads it on the VPS with
# `docker load` (docs/deploy-runbook.md, "Imagem do Waxum"). Run it before the
# commit that points docker-compose.yml at the new tag reaches main.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da imagem, ex.: 0.12.6-multirelay-v4-opus (release waxum-<tag>, asset waxum-<tag>.tar.gz)'
        required: true

permissions:
  contents: read

concurrency:
  group: zapliga-production
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Baixar a imagem do release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release download "waxum-$TAG" --repo "$GITHUB_REPOSITORY" --pattern "waxum-$TAG.tar.gz" --dir "$RUNNER_TEMP"
          gzip -t "$RUNNER_TEMP/waxum-$TAG.tar.gz"

      - name: Carregar na VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -H -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts"
          fi
          deploy_key="$RUNNER_TEMP/zapliga-deploy-key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$deploy_key"
          chmod 600 "$deploy_key"
          ssh_vps() { ssh -i "$deploy_key" -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "$@"; }
          ssh_vps 'gunzip | docker load' < "$RUNNER_TEMP/waxum-$TAG.tar.gz"
          ssh_vps "docker image inspect --format '{{.Id}} {{.Created}}' zapliga-waxum:$TAG"
          rm -f "$deploy_key"
