server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;

  location = /app {
    return 301 /app/;
  }

  location = /cadastro {
    return 301 /app/cadastro;
  }

  location /app/ {
    try_files $uri $uri/ /app/index.html;
  }

  location ~ ^/invite/(.*)$ {
    return 301 /app/invite/$1;
  }

  location = / {
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
