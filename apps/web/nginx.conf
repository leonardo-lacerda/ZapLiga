server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;

  # Vite emits content-hashed filenames under /app/assets, so a changed build
  # always has a new URL. These are safe to cache forever; the hash busts them.
  location ^~ /app/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
  }

  # index.html must never be cached: it is the file that points at the current
  # asset hashes. If a browser serves a stale index.html it loads stale JS —
  # which is exactly how an SDR ended up running old audio code after a deploy.
  location = /app {
    return 301 /app/;
  }

  # Public account flows must be handled by the SPA so their query tokens are
  # consumed by React instead of falling through to the marketing landing page.
  location ~ ^/(login|registro|esqueci-senha|redefinir-senha|verificar-email)/?$ {
    add_header Cache-Control "no-cache" always;
    try_files /app/index.html =404;
  }

  location ~ ^/convite/[^/]+/?$ {
    add_header Cache-Control "no-cache" always;
    try_files /app/index.html =404;
  }

  location = /cadastro {
    return 301 /registro;
  }

  # Public legal pages use stable, readable URLs instead of the source filenames.
  location ~ ^/termos/?$ {
    add_header Cache-Control "no-cache" always;
    try_files /termos-de-uso.html =404;
  }

  location ~ ^/privacidade/?$ {
    add_header Cache-Control "no-cache" always;
    try_files /privacidade.html =404;
  }

  location ~ ^/invite/(.*)$ {
    return 301 /convite/$1;
  }

  location = /app/cadastro {
    return 301 /registro;
  }

  location ~ ^/app/invite/(.*)$ {
    return 301 /convite/$1;
  }

  location /app/ {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /app/index.html;
  }

  location = / {
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
