server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;

  location = /app {
    return 301 /app/;
  }

  location ~ ^/(login|registro)/?$ {
    try_files /app/index.html =404;
  }

  location ~ ^/convite/[^/]+/?$ {
    try_files /app/index.html =404;
  }

  location = /cadastro {
    return 301 /registro;
  }

  location ~ ^/invite/(.*)$ {
    return 301 /convite/$1;
  }

  location = /app/cadastro {
    return 301 /registro;
  }

  location ~ ^/app/invite/(.*)$ {
    return 301 /convite/$1;
  }

  location /app/ {
    try_files $uri $uri/ /app/index.html;
  }

  location = / {
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
