x-api-environment: &api-environment
  NODE_ENV: ${NODE_ENV:-development}
  PORT: 3000
  DATABASE_URL: postgres://${POSTGRES_USER:-zapcall}:${POSTGRES_PASSWORD:-zapcall}@postgres:5432/${POSTGRES_DB:-zapcall}
  REDIS_URL: redis://redis:6379
  WAXUM_URL: http://waxum:3451
  WAXUM_API_KEY: ${WAXUM_API_KEY:-zapcall-local-waxum-token}
  WAXUM_JWT_SECRET: ${WAXUM_JWT_SECRET:-zapcall-local-jwt-secret-change-me}
  NATS_URL: nats://nats:4222
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-zapcall-local-access-secret-change-me}
  LEGACY_TENANT_ID: ${LEGACY_TENANT_ID:-tenant-legado}
  LEGACY_TENANT_NAME: ${LEGACY_TENANT_NAME:-Operação legada}
  LEGACY_TENANT_SLUG: ${LEGACY_TENANT_SLUG:-operacao-legada}
  JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
  INVITATION_TTL_SECONDS: ${INVITATION_TTL_SECONDS:-172800}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM: ${RESEND_FROM:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
  AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
  API_INSTANCE_ID: ${API_INSTANCE_ID:-}
  PG_POOL_MAX: ${PG_POOL_MAX:-10}
  PG_IDLE_TIMEOUT_MS: ${PG_IDLE_TIMEOUT_MS:-30000}
  PG_CONNECTION_TIMEOUT_MS: ${PG_CONNECTION_TIMEOUT_MS:-5000}
  DASHBOARD_CACHE_TTL_MS: ${DASHBOARD_CACHE_TTL_MS:-1500}

x-api-common: &api-common
  init: true
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  environment:
    <<: *api-environment
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    waxum:
      condition: service_started
    nats:
      condition: service_started
  restart: unless-stopped
  stop_grace_period: 45s
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 3

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zapcall}
      POSTGRES_USER: ${POSTGRES_USER:-zapcall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zapcall}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-zapcall} -d $${POSTGRES_DB:-zapcall}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Daily local pg_dump with rotation. This protects against accidental
  # deletes/bad migrations, not against loss of the host itself — copy
  # postgres_backups off-box periodically for real disaster recovery.
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-zapcall}
      POSTGRES_USER: ${POSTGRES_USER:-zapcall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zapcall}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - postgres_backups:/backups

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--store_dir=/data"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data

  waxum:
    image: fdciabdul/waxum:0.12.4@sha256:056342ba0f4d269563057573d796de848df8e3b52043463f344bd68065227e18
    restart: unless-stopped
    ports:
      - "127.0.0.1:3451:3451"
    environment:
      PORT: 3451
      RUST_LOG: info
      WHATSAPP_STORAGE_PATH: /app/whatsapp_sessions
      SUPERADMIN_TOKEN: ${WAXUM_API_KEY:-zapcall-local-waxum-token}
      JWT_SECRET: ${WAXUM_JWT_SECRET:-zapcall-local-jwt-secret-change-me}
      NATS_URL: nats://nats:4222
      # ZapLiga owns request pacing and abuse protection. Waxum 0.12.4 allows
      # its peer-IP middleware to be disabled, avoiding one shared Docker-IP
      # quota for every tenant and API replica.
      RATE_LIMIT_ENABLED: "false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:3451/livez"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - waxum_data:/app/whatsapp_sessions
    depends_on:
      - nats

  api-a:
    <<: *api-common
    environment:
      <<: *api-environment
      API_INSTANCE_ID: api-a
    ports:
      - "127.0.0.1:3000:3000"

  api-b:
    <<: *api-common
    environment:
      <<: *api-environment
      API_INSTANCE_ID: api-b
    ports:
      - "127.0.0.1:3001:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    depends_on:
      - api-a
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"

volumes:
  postgres_data:
  postgres_backups:
  redis_data:
  nats_data:
  waxum_data:
