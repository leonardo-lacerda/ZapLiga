    environment:
      EGRESS_SLOT: edge-9
      WAXUM_API_KEY: ${WAXUM_API_KEY:-zapcall-local-waxum-token}
    volumes:
      - tailscale_edge_9:/var/lib/tailscale
      - egress_edge_9:/egress
      - ./infra/egress/edge-entrypoint.sh:/usr/local/bin/edge-entrypoint.sh:ro

  waxum-edge-9:
    <<: *edge-waxum
    network_mode: service:tailscale-edge-9
    environment:
      <<: *edge-waxum-environment
      EGRESS_SLOT: edge-9
    volumes:
      - waxum_data:/app/whatsapp_sessions
      - waxum_edge_9_data:/app/registry
      - egress_edge_9:/egress:ro
      - ./infra/egress/waxum-edge-guard.sh:/usr/local/bin/waxum-edge-guard.sh:ro
      - ./infra/waxum/entrypoint-guard.sh:/usr/local/bin/waxum-entrypoint-guard.sh:ro
      - ./infra/waxum/healthcheck.sh:/usr/local/bin/waxum-healthcheck.sh:ro
    depends_on:
      - tailscale-edge-9
      - nats

  tailscale-edge-10:
    <<: *edge-tailscale
    hostname: zapliga-edge-10
    environment:
      EGRESS_SLOT: edge-10
      WAXUM_API_KEY: ${WAXUM_API_KEY:-zapcall-local-waxum-token}
    volumes:
      - tailscale_edge_10:/var/lib/tailscale
      - egress_edge_10:/egress
      - ./infra/egress/edge-entrypoint.sh:/usr/local/bin/edge-entrypoint.sh:ro

  waxum-edge-10:
    <<: *edge-waxum
    network_mode: service:tailscale-edge-10
    environment:
      <<: *edge-waxum-environment
      EGRESS_SLOT: edge-10
    volumes:
      - waxum_data:/app/whatsapp_sessions
      - waxum_edge_10_data:/app/registry
      - egress_edge_10:/egress:ro
      - ./infra/egress/waxum-edge-guard.sh:/usr/local/bin/waxum-edge-guard.sh:ro
      - ./infra/waxum/entrypoint-guard.sh:/usr/local/bin/waxum-entrypoint-guard.sh:ro
      - ./infra/waxum/healthcheck.sh:/usr/local/bin/waxum-healthcheck.sh:ro
    depends_on:
      - tailscale-edge-10
      - nats

  # Proxy slot (docs/saida-por-proxy.md): everything the slot's Waxum sends goes out through a
  # residential SOCKS5 proxy registered in Admin → Saídas de internet → Proxies, UDP included,
  # so its line keeps an IP of its own. No proxy, or a dead one, leaves the slot without internet.
  proxy-edge-1:
    image: xjasonlyu/tun2socks:v2.6.0@sha256:aa931665f4a3ad9be7bc1ea5117c41471c20a770a62490e38090c839c1fef107
    entrypoint: ["/bin/sh", "/usr/local/bin/proxy-entrypoint.sh"]
    restart: unless-stopped
    hostname: zapliga-proxy-1
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    environment:
      EGRESS_SLOT: proxy-1
      WAXUM_API_KEY: ${WAXUM_API_KEY:-zapcall-local-waxum-token}
    volumes:
      - egress_proxy_1:/egress
      - ./infra/egress/proxy-entrypoint.sh:/usr/local/bin/proxy-entrypoint.sh:ro

  waxum-proxy-edge-1:
    <<: *edge-waxum
    # Sends call media only to the relay the lead answers on (docs/waxum-version.md): the proxy is
    # billed per GB. Edge PCs stay on v5-signal until this one is proven on real calls.
    image: zapliga-waxum:0.12.6-multirelay-v7-relay-unwrap
    network_mode: service:proxy-edge-1
    environment:
      <<: *edge-waxum-environment
      EGRESS_SLOT: proxy-1
      WA_DEVICE_PLATFORM: chrome
      WA_DEVICE_OS: Windows
      WA_CLIENT_LOCALE: pt_BR
    volumes:
      - waxum_data:/app/whatsapp_sessions
      - waxum_proxy_1_data:/app/registry
      - egress_proxy_1:/egress:ro
      - ./infra/egress/waxum-edge-guard.sh:/usr/local/bin/waxum-edge-guard.sh:ro
      - ./infra/waxum/entrypoint-guard.sh:/usr/local/bin/waxum-entrypoint-guard.sh:ro
      - ./infra/waxum/healthcheck.sh:/usr/local/bin/waxum-healthcheck.sh:ro
    depends_on:
      - proxy-edge-1
      - nats

  api-a:
    <<: *api-common
    image: zapliga-api-a:latest
    environment:
      <<: *api-environment
      API_INSTANCE_ID: api-a
    ports:
      - "127.0.0.1:${API_A_HOST_PORT:-3000}:3000"
    # Shared by both instances: any of them encodes, transcribes and serves a recording.
    volumes:
      - call_recordings:/var/lib/zapliga/recordings

  api-b:
    <<: *api-common
    image: zapliga-api-b:latest
    environment:
      <<: *api-environment
      API_INSTANCE_ID: api-b
    ports:
      - "127.0.0.1:${API_B_HOST_PORT:-3001}:3000"
    volumes:
      - call_recordings:/var/lib/zapliga/recordings

  # Automação dos cloud phones do GeeLark (ADB + uiautomator2). Só a rede interna
  # do Compose fala com ele (sem porta publicada). O deploy builda a imagem (Python,
  # leve) e sobe este serviço e o socks-gateway depois do web.
  geelark-worker:
    build:
      context: services/geelark-worker
    image: zapliga-geelark-worker:latest
    init: true
    restart: unless-stopped
    environment:
      GEELARK_API_TOKEN: ${GEELARK_API_TOKEN:-}
      GEELARK_WORKER_TOKEN: ${GEELARK_WORKER_TOKEN:-zapcall-local-worker-token}
      WORKER_MAX_JOBS: ${GEELARK_WORKER_MAX_JOBS:-2}
      WORKER_DATA_DIR: /data
      # Copiloto de IA para telas desconhecidas (services/geelark-worker/README.md). Vazio = desligado.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WORKER_COPILOT: ${WORKER_COPILOT:-on}
    volumes:
      # Telas aprendidas e telas reais arquivadas: sobrevivem ao deploy.
      - geelark_worker_data:/data
    stop_grace_period: 30s

  # Proxy SOCKS5 do cadastro (docs/saida-pelo-pc-do-atendente.md, "Proxy do cadastro").
  # Usuário = vaga (edge-N), senha = EGRESS_SOCKS_PASSWORD (vazia recusa tudo). A porta
  # fica só em 127.0.0.1 até o .env de produção definir EGRESS_SOCKS_BIND=0.0.0.0.
  socks-gateway:
    <<: *socks-common
    command: ["python", "-m", "app.socks5", "gateway"]
    environment:
      EGRESS_SOCKS_PASSWORD: ${EGRESS_SOCKS_PASSWORD:-}
      # UDP ASSOCIATE: the phone sends UDP to this host/port (same number as the TCP one).
      EGRESS_SOCKS_PUBLIC_HOST: ${EGRESS_SOCKS_PUBLIC_HOST:-}
      EGRESS_SOCKS_PORT: ${EGRESS_SOCKS_PORT:-1080}
    ports:
      - "${EGRESS_SOCKS_BIND:-127.0.0.1}:${EGRESS_SOCKS_PORT:-1080}:1080"
      - "${EGRESS_SOCKS_BIND:-127.0.0.1}:${EGRESS_SOCKS_PORT:-1080}:1080/udp"

  # One SOCKS5 per PC slot, in the slot's network (reachable as tailscale-edge-N:1080).
  # The slot containers above are untouched: these only attach to them.
  socks-edge-1:
    <<: *socks-edge
    network_mode: service:tailscale-edge-1
    environment:
      EGRESS_SLOT: edge-1
    volumes:
      - egress_edge_1:/egress:ro
    depends_on:
      - tailscale-edge-1

  socks-edge-2:
    <<: *socks-edge
    network_mode: service:tailscale-edge-2
    environment:
      EGRESS_SLOT: edge-2
    volumes:
      - egress_edge_2:/egress:ro
    depends_on:
      - tailscale-edge-2

  socks-edge-3:
    <<: *socks-edge
    network_mode: service:tailscale-edge-3
    environment:
      EGRESS_SLOT: edge-3
    volumes:
      - egress_edge_3:/egress:ro
    depends_on:
      - tailscale-edge-3

  socks-edge-4:
    <<: *socks-edge
    network_mode: service:tailscale-edge-4
    environment:
      EGRESS_SLOT: edge-4
    volumes:
      - egress_edge_4:/egress:ro
    depends_on:
      - tailscale-edge-4

  socks-edge-5:
    <<: *socks-edge
    network_mode: service:tailscale-edge-5
    environment:
      EGRESS_SLOT: edge-5
    volumes:
      - egress_edge_5:/egress:ro
    depends_on:
      - tailscale-edge-5

  socks-edge-6:
    <<: *socks-edge
    network_mode: service:tailscale-edge-6
    environment:
      EGRESS_SLOT: edge-6
    volumes:
      - egress_edge_6:/egress:ro
    depends_on:
      - tailscale-edge-6

  socks-edge-7:
    <<: *socks-edge
    network_mode: service:tailscale-edge-7
    environment:
      EGRESS_SLOT: edge-7
    volumes:
      - egress_edge_7:/egress:ro
    depends_on:
      - tailscale-edge-7

  socks-edge-8:
    <<: *socks-edge
    network_mode: service:tailscale-edge-8
    environment:
      EGRESS_SLOT: edge-8
    volumes:
      - egress_edge_8:/egress:ro
    depends_on:
      - tailscale-edge-8

  socks-edge-9:
    <<: *socks-edge
    network_mode: service:tailscale-edge-9
    environment:
      EGRESS_SLOT: edge-9
    volumes:
      - egress_edge_9:/egress:ro
    depends_on:
      - tailscale-edge-9

  socks-edge-10:
    <<: *socks-edge
    network_mode: service:tailscale-edge-10
    environment:
      EGRESS_SLOT: edge-10
    volumes:
      - egress_edge_10:/egress:ro
    depends_on:
      - tailscale-edge-10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-false}
    depends_on:
      - api-a
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5173}:80"

volumes:
  postgres_data:
  postgres_backups:
  redis_data:
