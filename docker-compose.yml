x-api-environment: &api-environment
  NODE_ENV: ${NODE_ENV:-development}
  PORT: 3000
  DATABASE_URL: postgres://${POSTGRES_USER:-zapcall}:${POSTGRES_PASSWORD:-zapcall}@postgres:5432/${POSTGRES_DB:-zapcall}
  REDIS_URL: redis://redis:6379
  WAXUM_URL: http://waxum:3451
  # The PC slots below: Waxums that go out through an attendant's PC
  # (docs/saida-pelo-pc-do-atendente.md). Admin → Saídas de internet assigns them.
  WAXUM_EDGE_NODES: ${WAXUM_EDGE_NODES:-edge-1=http://tailscale-edge-1:3451,edge-2=http://tailscale-edge-2:3451,edge-3=http://tailscale-edge-3:3451,edge-4=http://tailscale-edge-4:3451,edge-5=http://tailscale-edge-5:3451,edge-6=http://tailscale-edge-6:3451,edge-7=http://tailscale-edge-7:3451,edge-8=http://tailscale-edge-8:3451,edge-9=http://tailscale-edge-9:3451,edge-10=http://tailscale-edge-10:3451,proxy-1=http://proxy-edge-1:3451}
  WAXUM_API_KEY: ${WAXUM_API_KEY:-zapcall-local-waxum-token}
  WAXUM_JWT_SECRET: ${WAXUM_JWT_SECRET:-zapcall-local-jwt-secret-change-me}
  NATS_URL: nats://nats:4222
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-zapcall-local-access-secret-change-me}
  LEGACY_TENANT_ID: ${LEGACY_TENANT_ID:-tenant-legado}
  LEGACY_TENANT_NAME: ${LEGACY_TENANT_NAME:-Operação legada}
  LEGACY_TENANT_SLUG: ${LEGACY_TENANT_SLUG:-operacao-legada}
  JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
  INVITATION_TTL_SECONDS: ${INVITATION_TTL_SECONDS:-172800}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM: ${RESEND_FROM:-}
  DATA_PROTECTION_SECRET: ${DATA_PROTECTION_SECRET:-change-this-data-protection-secret}
  METRICS_TOKEN: ${METRICS_TOKEN:-change-this-metrics-token}
  PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-false}
  E2E_TEST_MODE: ${E2E_TEST_MODE:-false}
  SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
  SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
  SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Admin supremo}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
  AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
  # Public origin used in credentials shown to external systems. Keep the
  # production-safe default here; local/E2E stacks override it explicitly.
  PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-https://api.zapliga.com}
  API_INSTANCE_ID: ${API_INSTANCE_ID:-}
  PG_POOL_MAX: ${PG_POOL_MAX:-10}
  PG_IDLE_TIMEOUT_MS: ${PG_IDLE_TIMEOUT_MS:-30000}
  PG_CONNECTION_TIMEOUT_MS: ${PG_CONNECTION_TIMEOUT_MS:-5000}
  DASHBOARD_CACHE_TTL_MS: ${DASHBOARD_CACHE_TTL_MS:-1500}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_API_VERSION: ${STRIPE_API_VERSION:-2025-06-30.basil}
  STRIPE_LIVEMODE: ${STRIPE_LIVEMODE:-false}
  STRIPE_PORTAL_CONFIGURATION_ID: ${STRIPE_PORTAL_CONFIGURATION_ID:-}
  # Blank means: enforce in production, off in development/test. Set
  # `shadow` explicitly during a staged rollout before switching to enforce.
  BILLING_ENFORCEMENT_MODE: ${BILLING_ENFORCEMENT_MODE:-}
  BILLING_WORKER_ENABLED: ${BILLING_WORKER_ENABLED:-true}
  BILLING_WORKER_INTERVAL_MS: ${BILLING_WORKER_INTERVAL_MS:-15000}
  BILLING_RECONCILE_INTERVAL_MS: ${BILLING_RECONCILE_INTERVAL_MS:-300000}
  BILLING_STALE_AFTER_MS: ${BILLING_STALE_AFTER_MS:-1800000}
  # Call recording (tenant flag `call_recording`) and transcription with Whisper on Groq.
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_TRANSCRIPTION_MODEL: ${GROQ_TRANSCRIPTION_MODEL:-whisper-large-v3}
  GROQ_TRANSCRIPTION_PROMPT: ${GROQ_TRANSCRIPTION_PROMPT:-}
  CALL_TRANSCRIPTION_MIN_SECONDS: ${CALL_TRANSCRIPTION_MIN_SECONDS:-15}
  # Cadastro de WhatsApp em cloud phones (docs/provisioning-contract.md). O phone sai
  # pelo PC do atendente através do socks-gateway (seção 4). Sem
  # EGRESS_SOCKS_PUBLIC_HOST/EGRESS_SOCKS_PASSWORD o assistente fica bloqueado.
  GEELARK_WORKER_URL: ${GEELARK_WORKER_URL:-http://geelark-worker:8080}
  GEELARK_WORKER_TOKEN: ${GEELARK_WORKER_TOKEN:-zapcall-local-worker-token}
  EGRESS_SOCKS_PUBLIC_HOST: ${EGRESS_SOCKS_PUBLIC_HOST:-}
  EGRESS_SOCKS_PORT: ${EGRESS_SOCKS_PORT:-1080}
  EGRESS_SOCKS_PASSWORD: ${EGRESS_SOCKS_PASSWORD:-}
  EGRESS_SOCKS_INTERNAL_URL: ${EGRESS_SOCKS_INTERNAL_URL:-socks-gateway:1080}

x-edge-tailscale: &edge-tailscale
  image: tailscale/tailscale:v1.104.7
  entrypoint: ["/bin/sh", "/usr/local/bin/edge-entrypoint.sh"]
  restart: unless-stopped
  devices:
    - /dev/net/tun:/dev/net/tun
  cap_add:
    - NET_ADMIN
    - NET_RAW

x-edge-waxum: &edge-waxum
  # v7: call media goes only to the relay the lead answers on (docs/waxum-version.md), which cuts each
  # call's upload through the attendants' shared office internet to about a third.
  image: zapliga-waxum:0.12.6-multirelay-v7-relay-unwrap
  entrypoint: ["/bin/sh", "/usr/local/bin/waxum-edge-guard.sh"]
  command: ["/app/waxum"]
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "/bin/sh", "/usr/local/bin/waxum-healthcheck.sh"]
    interval: 30s
    timeout: 5s
    start_period: 20s
    retries: 3

x-edge-waxum-environment: &edge-waxum-environment
  PORT: 3451
  RUST_LOG: info
  WHATSAPP_STORAGE_PATH: /app/whatsapp_sessions
  SUPERADMIN_TOKEN: ${WAXUM_API_KEY:-zapcall-local-waxum-token}
  JWT_SECRET: ${WAXUM_JWT_SECRET:-zapcall-local-jwt-secret-change-me}
  NATS_URL: nats://nats:4222
  RATE_LIMIT_ENABLED: "false"
  WA_CALL_AUDIO_CODEC: opus
  EGRESS_ROUTE_FILE: /egress/route
  # This Waxum's own list of sessions; the sessions themselves are shared.
  SQLITE_PATH: /app/registry/waxum.db

# Registration proxy (docs/provisioning-contract.md, section 4): the GeeLark cloud
# phone talks SOCKS5 to socks-gateway, which hands the connection to the slot's
# socks-edge-N. Same image as geelark-worker (built by the deploy, light Python).
x-socks-common: &socks-common
  image: zapliga-geelark-worker:latest
  # Built locally from services/geelark-worker; never pulled from a registry.
  pull_policy: never
  init: true
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 1080), 3).close()"]
    interval: 30s
    timeout: 5s
    start_period: 10s
    retries: 3

# One per PC slot, inside tailscale-edge-N's network: accepts only while
# /egress/route is `pc`, so a registration never goes out through the VPS.
x-socks-edge: &socks-edge
  <<: *socks-common
  command: ["python", "-m", "app.socks5", "edge"]

x-api-common: &api-common
  init: true
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  environment:
    <<: *api-environment
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    waxum:
      condition: service_healthy
    nats:
      condition: service_healthy
  restart: unless-stopped
  stop_grace_period: 45s
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 3

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zapcall}
      POSTGRES_USER: ${POSTGRES_USER:-zapcall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zapcall}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-zapcall} -d $${POSTGRES_DB:-zapcall}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Daily local pg_dump with rotation. This protects against accidental
  # deletes/bad migrations, not against loss of the host itself — copy
  # postgres_backups off-box periodically for real disaster recovery.
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-zapcall}
      POSTGRES_USER: ${POSTGRES_USER:-zapcall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zapcall}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - postgres_backups:/backups

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NATS_HOST_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_HOST_PORT:-8222}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  waxum:
    # Build local em whatsapp-rust com bind em TODOS os relays uteis da oferta,
    # nao so o escolhido (issue #1098 upstream + purpshell/meowcaller#26): quem
    # atende elege o proprio relay depois do accept e pode migrar a midia dele
    # para um host diferente do que bindamos — sem isso a chamada "conecta" mas
    # fica unidirecional (SDR nunca ouve o cliente). A imagem stock do
    # fdciabdul/waxum NAO tem essa correcao — nao trocar de volta para ela sem
    # reaplicar o patch em whatsapp-rust/. Ver docs/deploy-runbook.md.
    image: zapliga-waxum:0.12.6-multirelay-v4-opus
    entrypoint: ["/bin/sh", "/usr/local/bin/waxum-entrypoint-guard.sh"]
    command: ["/app/waxum"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WAXUM_HOST_PORT:-3451}:3451"
    environment:
      PORT: 3451
      RUST_LOG: info
      WHATSAPP_STORAGE_PATH: /app/whatsapp_sessions
      SUPERADMIN_TOKEN: ${WAXUM_API_KEY:-zapcall-local-waxum-token}
      JWT_SECRET: ${WAXUM_JWT_SECRET:-zapcall-local-jwt-secret-change-me}
      NATS_URL: nats://nats:4222
      # ZapLiga owns request pacing and abuse protection. Waxum 0.12.6 allows
      # its peer-IP middleware to be disabled, avoiding one shared Docker-IP
      # quota for every tenant and API replica.
      RATE_LIMIT_ENABLED: "false"
      # Offer standard Opus, not MLow: our MLow decoder drops the phone's
      # low-bitrate and 10 ms frames, which the caller hears as holes in the
      # other side's voice. `mlow` brings the old behaviour back (infra/waxum/README.md).
      WA_CALL_AUDIO_CODEC: opus
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/waxum-healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - waxum_data:/app/whatsapp_sessions
      - ./infra/waxum/entrypoint-guard.sh:/usr/local/bin/waxum-entrypoint-guard.sh:ro
      - ./infra/waxum/healthcheck.sh:/usr/local/bin/waxum-healthcheck.sh:ro
    depends_on:
      nats:
        condition: service_healthy

  # --- PC slots: internet exit through an attendant's PC (docs/saida-pelo-pc-do-atendente.md) ---
  # Each slot is a pair: tailscale-edge-N sends everything in its network out
  # through the PC the API put on the slot, and waxum-edge-N holds that PC's
  # lines inside that network. A slot with no PC stays idle. The API reaches it
  # at http://tailscale-edge-N:3451.
  # Every Waxum mounts the same session storage (waxum_data), each with its own
  # registry (SQLITE_PATH): a line moves between exits without a new QR.
  tailscale-edge-1:
    <<: *edge-tailscale
    hostname: zapliga-edge-1
    environment:
      EGRESS_SLOT: edge-1
      WAXUM_API_KEY: ${WAXUM_API_KEY:-zapcall-local-waxum-token}
    volumes:
      - tailscale_edge_1:/var/lib/tailscale
      - egress_edge_1:/egress
      - ./infra/egress/edge-entrypoint.sh:/usr/local/bin/edge-entrypoint.sh:ro

  waxum-edge-1:
    <<: *edge-waxum
    # Same image as the other edges; edge-1 also declares the Windows/pt-BR identity (new pairings).
    image: zapliga-waxum:0.12.6-multirelay-v7-relay-unwrap
    network_mode: service:tailscale-edge-1
    environment:
      <<: *edge-waxum-environment
      EGRESS_SLOT: edge-1
      # A browser companion with the operation's locale (registration and handshake).
      WA_DEVICE_PLATFORM: chrome
      WA_DEVICE_OS: Windows
      WA_CLIENT_LOCALE: pt_BR
    volumes:
      - waxum_data:/app/whatsapp_sessions
      - waxum_edge_1_data:/app/registry
      - egress_edge_1:/egress:ro
      - ./infra/egress/waxum-edge-guard.sh:/usr/local/bin/waxum-edge-guard.sh:ro
      - ./infra/waxum/entrypoint-guard.sh:/usr/local/bin/waxum-entrypoint-guard.sh:ro
      - ./infra/waxum/healthcheck.sh:/usr/local/bin/waxum-healthcheck.sh:ro
    depends_on:
      - tailscale-edge-1
      - nats

  tailscale-edge-2:
    <<: *edge-tailscale
    hostname: zapliga-edge-2
    environment:
      EGRESS_SLOT: edge-2
      WAXUM_API_KEY: ${WAXUM_API_KEY:-zapcall-local-waxum-token}
