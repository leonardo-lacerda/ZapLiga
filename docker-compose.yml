services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zapcall}
      POSTGRES_USER: ${POSTGRES_USER:-zapcall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zapcall}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-zapcall} -d $${POSTGRES_DB:-zapcall}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--store_dir=/data"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data

  waxum:
    image: fdciabdul/waxum:0.12.2@sha256:b939815637dc8f382504083fcc83b8b8e66577adfd6e0aee60025feac548122b
    restart: unless-stopped
    ports:
      - "127.0.0.1:3451:3451"
    environment:
      PORT: 3451
      RUST_LOG: info
      WHATSAPP_STORAGE_PATH: /app/whatsapp_sessions
      SUPERADMIN_TOKEN: ${WAXUM_API_KEY:-zapcall-local-waxum-token}
      JWT_SECRET: ${WAXUM_JWT_SECRET:-zapcall-local-jwt-secret-change-me}
      NATS_URL: nats://nats:4222
      # API polling and media sockets share one Docker peer IP.
      RATE_LIMIT_PER_SECOND: ${WAXUM_RATE_LIMIT_PER_SECOND:-200}
      RATE_LIMIT_BURST: ${WAXUM_RATE_LIMIT_BURST:-1000}
    volumes:
      - waxum_data:/app/whatsapp_sessions
    depends_on:
      - nats

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-zapcall}:${POSTGRES_PASSWORD:-zapcall}@postgres:5432/${POSTGRES_DB:-zapcall}
      REDIS_URL: redis://redis:6379
      WAXUM_URL: http://waxum:3451
      WAXUM_API_KEY: ${WAXUM_API_KEY:-zapcall-local-waxum-token}
      WAXUM_JWT_SECRET: ${WAXUM_JWT_SECRET:-zapcall-local-jwt-secret-change-me}
      NATS_URL: nats://nats:4222
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-zapcall-local-access-secret-change-me}
      LEGACY_TENANT_ID: ${LEGACY_TENANT_ID:-tenant-legado}
      LEGACY_TENANT_NAME: ${LEGACY_TENANT_NAME:-Operação legada}
      LEGACY_TENANT_SLUG: ${LEGACY_TENANT_SLUG:-operacao-legada}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      INVITATION_TTL_SECONDS: ${INVITATION_TTL_SECONDS:-172800}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      waxum:
        condition: service_started
      nats:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "127.0.0.1:3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"

volumes:
  postgres_data:
  redis_data:
  nats_data:
  waxum_data:
