upstream zapliga_api {
    # Keep the browser control WebSocket and its media WebSocket on the same
    # API process. The application also stores ownership in Postgres/Redis;
    # this affinity prevents an HTTP request from crossing the local socket
    # boundary while a call is active.
    ip_hash;
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name api.zapliga.com;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    access_log /www/sites/api.zapliga.com/log/access.log icp_json;
    error_log /www/sites/api.zapliga.com/log/error.log;

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    location / {
        proxy_pass http://zapliga_api;
    }

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    ssl_certificate /www/sites/api.zapliga.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/api.zapliga.com/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
